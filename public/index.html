<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shishō</title>
<link rel="icon" href="tako-sensei.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="ja.js"></script>
<style>
  /* the shishō page, from the approved detail sketch */
  .bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .c-8 { grid-column: span 8; } .c-4 { grid-column: span 4; } .c-12 { grid-column: span 12; } .c-6 { grid-column: span 6; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .head h3 { font-size: 16px; font-weight: 600; }
  .head .r { margin-left: auto; display: flex; gap: 6px; }
  .inner { background: var(--inner); border: 1px solid var(--line); border-radius: 16px; }
  .depth { display: grid; gap: 8px; }
  .drow { display: grid; grid-template-columns: 1fr 86px; gap: 10px; align-items: center; font-size: 12.5px; }
  .dbar { position: relative; height: 28px; border-radius: 8px; background: #16161d; overflow: hidden; display: flex; align-items: center; padding: 0 10px; }
  .dbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; }
  .dbar span { position: relative; font-weight: 600; }
  .dbar.pass i { background: linear-gradient(90deg, #1f9e59, var(--green)); } .dbar.pass span { color: #03140a; }
  .dbar.fail i { background: linear-gradient(90deg, #7a2f1f, var(--orange)); } .dbar.fail span { color: #1b0703; }
  .drow .v { text-align: right; font-family: "JetBrains Mono", monospace; }
  .stat { padding: 12px 14px; margin-top: 10px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 700; margin: 2px 0 6px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts span { font-size: 11.5px; border-radius: 999px; padding: 4px 10px; background: #1a1a22; color: var(--muted); }
  .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
  .go { display: block; width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 13px; font: 700 14px Manrope; color: #04130a; background: linear-gradient(180deg, #6cf5a8, var(--green)); cursor: pointer; }
  .go:disabled { opacity: .6; cursor: default; }
  .field { width: 100%; margin-top: 10px; background: var(--inner); border: 1px solid var(--line2); border-radius: 12px; padding: 11px 12px; color: var(--ink); font: 500 13px Manrope; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px "JetBrains Mono"; border-radius: 999px; padding: 4px 10px; }
  .badge.ok { background: #3ef08a1a; color: var(--green); } .badge.bad { background: #ff5c5c1a; color: var(--red); } .badge.info { background: #8b6cff1f; color: #b8a6ff; }
  .quote { border-left: 2px solid var(--green); padding: 2px 0 2px 12px; color: var(--muted); font-size: 13.5px; margin-top: 14px; }
  .log { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .log th { text-align: left; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .log td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .log td:first-child { white-space: nowrap; color: var(--muted); font-family: "JetBrains Mono"; }
  .kind { font: 600 11px "JetBrains Mono"; text-transform: uppercase; letter-spacing: .04em; }
  .kind.enter { color: var(--green); } .kind.exit { color: var(--gold); } .kind.stand_aside, .kind.no_entry, .kind.full { color: var(--muted); } .kind.unmarked, .kind.no_candidates { color: var(--orange); }
  .pos { padding: 12px 14px; margin-top: 10px; }
  .pos .l1 { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .rng { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff8a5c66, #16161d 40%, #16161d 60%, #3ef08a66); margin: 12px 0 6px; }
  .rng b { position: absolute; top: -5px; width: 3px; height: 18px; border-radius: 2px; background: var(--ink); }
  .ends { display: flex; justify-content: space-between; font: 400 11px "JetBrains Mono"; color: var(--muted); }
  .changes .chg { display: grid; grid-template-columns: 110px 190px 1fr auto; gap: 12px; align-items: baseline; padding: 11px 12px; border-radius: 12px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
  .changes .chg:hover { background: #ffffff06; }
  .changes .why { color: var(--muted); font-size: 13px; }
  @media (max-width: 900px) { .changes .chg { grid-template-columns: 1fr; gap: 4px; } }
  .kind.vetoed { color: #b8a6ff; }
  .idea { color: var(--muted); font-size: 14px; line-height: 1.55; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.simple .idea { min-height: 2.9em; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .nums b { display: block; font: 700 20px Manrope; letter-spacing: -.01em; }
  .nums span { font-size: 11.5px; color: var(--muted); }
  .nums.big3 b { font-size: 28px; }
  .latest { margin-top: 16px; background: var(--inner); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .latest p { margin-top: 6px; font-size: 15px; line-height: 1.55; }
  .steps3 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .steps3 span { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: #ffffff08; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .steps3 b { width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #04130a; display: grid; place-items: center; font-size: 12px; }
  details.more { margin-top: 16px; }
  details.more > summary { cursor: pointer; list-style: none; text-align: center; padding: 14px; border: 1px dashed var(--line2); border-radius: 16px; color: var(--muted); font-weight: 600; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more[open] > summary { color: var(--ink); }
  .changes .chg { grid-template-columns: 130px 200px 1fr; }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .rules span { font-size: 12px; border: 1px solid var(--line2); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
  .rules span b { color: var(--ink); font-weight: 600; }
  a.card { color: inherit; text-decoration: none; display: block; }
  a.card:hover { border-color: var(--line2); }
  a.card:focus-visible, .pill:focus-visible, .go:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  @media (max-width: 1100px) { .c-8, .c-4, .c-6 { grid-column: span 12; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/" style="color:inherit;text-decoration:none"><img src="tako-sensei.svg" width="34" height="34" alt="">Shishō <small>師匠</small></a>
    <a class="nav on" href="#/" id="nav-discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 11.5a3 3 0 1 0 0-6M17.5 14c2.5.4 4 2.4 4 5"/></svg>Discover shishō</a>
    <a class="nav" href="#/publish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Publish a strategy</a>
    <a class="nav" href="#/how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>How it works</a>
    <button class="pill" id="lang" style="margin-top:8px" aria-label="Switch language">日本語</button>
    <div class="mkt" id="mkt"><span><span class="dot"></span><b>RYO live</b></span><span>Reading the market…</span></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
// Everything in its own scope, so browser extensions that add globals can't collide with ours.
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (p, opts) => { const r = await fetch(p, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || "Request failed"); return j; };
const pct = v => v == null ? "—" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const big = n => n >= 1e9 ? `${+(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${+(n / 1e3).toFixed(1)}K` : String(n);
const when = s => s ? new Date(s).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const val = v => typeof v === "number" ? (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : String(+v.toFixed(v < 1 ? 4 : 2))) : v === true ? "yes" : v === false ? "no" : v == null ? "no data" : String(v);
let HOSTED = false;
const COLORS = ["#3ef08a", "#8b6cff", "#e05cc8", "#ff8a5c"];
const STATE = { enter: "Just bought", exit: "Just sold", stand_aside: "Standing aside", no_entry: "Watching", full: "Fully invested", new: "Starting", no_candidates: "Scan unavailable", unmarked: "Holding" };

function sparkPath(vals, w = 300, h = 78, pad = 8) {
  if (vals.length < 2) return null;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  return vals.map((v, i) => `${i ? "L" : "M"}${(i / (vals.length - 1) * w).toFixed(1)} ${(pad + (hi - v) / span * (h - 2 * pad)).toFixed(1)}`).join(" ");
}
function spark(vals, color) {
  const d = sparkPath(vals);
  if (!d) return `<div class="spark" style="height:78px;display:grid;place-items:center;color:var(--dim);font-size:12px">The record starts with its first cycle</div>`;
  const id = "g" + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 300 78" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L300 78 L0 78Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function shishoMarket(m, at) {
  if (!m) return;
  $("#mkt").innerHTML = `<span><span class="dot"></span><b>RYO live</b> · ${esc(when(at))}</span>
    <span>Fear &amp; Greed <b>${esc(m.fear_greed ?? "no data")}</b></span><span>Sentiment <b>${esc((m.sentiment_regime || "no data").replace(/_/g, " "))}</b></span>
    <span>Altseason <b>${esc(m.altseason_phase ?? "no data")}</b></span><span>Funding <b>${esc(m.funding_crowding ?? "no data")}</b></span>`;
}

// ── Wallet and payments ──
// RYO-CHAN lives on Solana, so payments are signed with a Solana wallet (Phantom).
// RYO-CHAN can't move until it lists on RYO's DEX, so the wallet signs a payment
// promise and the ledger marks it "settles at RYO-CHAN launch".
let WALLET = null;
async function connectWallet() {
  const p = window.phantom?.solana || window.solana;
  if (!p?.isPhantom) throw new Error("No Solana wallet found. Install Phantom, or pay with just your handle.");
  const r = await p.connect(); WALLET = r.publicKey.toString(); return WALLET;
}
async function signIntent(message) {
  if (!WALLET) return { wallet: null, signature: null, message };
  const p = window.phantom?.solana || window.solana;
  const { signature } = await p.signMessage(new TextEncoder().encode(message), "utf8");
  return { wallet: WALLET, signature: btoa(String.fromCharCode(...signature)), message };
}
const short = w => w ? w.slice(0, 4) + "…" + w.slice(-4) : "";
async function payment(body) {
  if (HOSTED) {   // the hosted site can't write files: keep it in this browser
    try { const all = JSON.parse(localStorage.getItem("shisho-payments") || "[]"); all.push({ ...body, at: new Date().toISOString(), status: "promised: settles at RYO-CHAN launch", browser_only: true }); localStorage.setItem("shisho-payments", JSON.stringify(all)); } catch {}
    return { ...body, browser_only: true };
  }
  return api("/api/pay", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
}

// ── Discover ──
let sortBy = "latest";
async function shishoDiscover() {
  const st = await api("/api/state");
  HOSTED = !!st.hosted;
  shishoMarket(st.market, st.updated_at);
  const order = Object.fromEntries((st.changes.items || []).map((c, i) => [c.strategy, i]));
  const list = [...st.shisho].sort((a, b) => (order[a.id] ?? 99) - (order[b.id] ?? 99));
  const first = s => { const m = String(s || "").match(/^.*?[.!?](\s|$)/); const x = (m ? m[0] : String(s || "")).trim(); return x.length > 130 ? x.slice(0, 127).trimEnd() + "…" : x; };
  const VERB = { exit: "sold", enter: "bought", vetoed: "council said no", stand_aside: "waiting", no_entry: "watching", full: "fully invested", unmarked: "couldn't price", no_candidates: "scan down" };
  const cardHtml = s => `<a class="card simple" href="#/s/${esc(s.id)}">
      <div class="who"><div class="ava"><img src="tako-sensei.svg" width="40" height="40" alt=""></div><div><b>${esc(s.name)}</b><small>${esc(s.creator.handle)}${s.creator.demo ? '<span class="tag">DEMO</span>' : ""}${s.state === "stand_aside" ? ' · <span style="color:var(--muted)">waiting for its market</span>' : ""}</small></div><span class="copy">Follow</span></div>
      <p class="idea">${esc(s.thesis)}</p>
      <div class="nums"><div><b class="up">${s.rules_kept.kept}/${s.rules_kept.checked}</b><span>rules kept</span></div><div><b class="${cls(s.return_pct)}">${pct(s.return_pct)}</b><span>practice return</span></div><div><b>${s.trades}</b><span>trades</span></div></div></a>`;
  $("#main").innerHTML = `
    <section class="banner"><div class="rays"></div>
      <h1 data-ja="<em>師匠</em>を見つけよう。<br>確かめられる戦略をフォロー。">Follow a trader<br>you can <em>check</em>.</h1>
      <p>Traders publish their strategy as rules. An AI agent follows those rules on RYO-CHAN's live market data, and shows you why it made every trade.</p>
      <div class="steps3"><span><b>1</b>Pick a shishō</span><span><b>2</b>See why it trades</span><span><b>3</b>Follow it</span></div>
      <img class="mascot" src="tako-sensei.svg" width="190" height="190" alt="Tako Sensei, the Shishō mascot"></section>
    <section class="card changes" style="margin-top:16px">
      <div class="head"><h3>This hour</h3><div class="r"><span class="note">${esc(when(st.changes.at))}</span></div></div>
      ${(st.changes.items || []).length ? st.changes.items.slice(0, 3).map(c => `<a class="chg" href="#/s/${esc(c.strategy)}"><span class="kind ${c.kind}">${esc(VERB[c.kind] || c.kind)}</span><b>${esc(c.name)}${c.symbol ? " · " + esc(c.symbol) : ""}</b><span class="why">${esc(first(c.text))}</span></a>`).join("")
        : `<p class="note">Nothing changed this hour.</p>`}
    </section>
    <div class="sec"><h2>Shishō</h2></div>
    <div class="cards">${list.map(cardHtml).join("")}</div>
    <p class="note">DEMO shishō were written by the Shishō team to start the marketplace. Their trades are real practice trades on live RYO data; no real money moves.</p>`;
}

// ── One shishō ──
function barWidth(c) {
  if (!c.pass && c.actual == null) return 0;
  if (typeof c.actual !== "number" || typeof c.value !== "number") return c.pass ? 100 : 18;
  const r = [">", ">="].includes(c.op) ? c.actual / c.value : c.value / c.actual;
  return Math.max(12, Math.min(100, (c.pass ? 70 : 20) + (r - 1) * 60));
}
const ruleText = c => `${c.field.replace(/_/g, " ")} ${({ ">": ">", ">=": "≥", "<": "<", "<=": "≤", "==": "is", "!=": "is not", in: "in", not_in: "not in" })[c.op]} ${Array.isArray(c.value) ? c.value.join("/") : val(c.value)}`;

async function shishoPage(id) {
  const s = await api(`/api/shisho/${encodeURIComponent(id)}`);
  const st = await api("/api/state"); HOSTED = !!st.hosted; shishoMarket(st.market, st.updated_at);
  const r = s.record, d0 = s.decisions.find(d => ["enter", "exit", "stand_aside"].includes(d.kind)) || s.decisions[0];
  const curve = r.curve.map(([, v]) => v);
  const cd = sparkPath(curve, 760, 220, 16);
  const title = !d0 ? "No decisions yet" : d0.kind === "enter" ? `Why it bought ${d0.symbol}` : d0.kind === "exit" ? `Why it sold ${d0.symbol}` : d0.kind === "stand_aside" ? "Why it's standing aside" : "Latest check";
  const latest = s.decisions.find(d => d.note?.text) || d0;
  $("#main").innerHTML = `
    <div class="top"><a class="back" href="#/">← All shishō</a></div>
    <div class="bento">
      <section class="card c-8">
        <div class="who" style="gap:14px"><img src="tako-sensei.svg" width="64" height="64" alt=""><div><div style="font-size:26px;font-weight:800;letter-spacing:-.01em">${esc(s.name)}</div><small>by ${esc(s.creator.handle)}${s.creator.demo ? '<span class="tag">DEMO</span>' : ""}</small></div></div>
        <p class="idea" style="font-size:16px;margin-top:12px">${esc(s.thesis)}</p>
        <div class="nums big3"><div><b class="up">${s.rules_kept.kept}/${s.rules_kept.checked}</b><span>rules kept, checked by replay</span></div><div><b class="${cls(r.return_pct)}">${pct(r.return_pct)}</b><span>practice return</span></div><div><b>${r.trades}</b><span>trades</span></div></div>
        ${latest ? `<div class="latest"><div class="label">Latest decision · ${esc(when(latest.at))}</div><p>${esc(latest.note?.text || latest.reason || "")}</p></div>` : ""}
      </section>
      <aside class="card c-4">
        <div class="head"><h3>Follow ${esc(s.name)}</h3></div>
        <div class="v" style="font-size:24px;font-weight:800">${big(s.fee.fee)} <span style="font-size:13px;color:var(--muted);font-weight:500">RYO-CHAN a month</span></div>
        <div class="split"><i style="flex:70;background:var(--green)"></i><i style="flex:24;background:var(--violet)"></i><i style="flex:6;background:var(--orange)"></i></div>
        <p class="note" style="margin-top:4px">70% to ${esc(s.creator.handle)} · 24% to RYO · 6% burned</p>
        <button class="pill" id="wallet" style="width:100%;margin-top:12px">Connect Solana wallet</button>
        <input class="field" id="handle" placeholder="Your handle, e.g. hanako_88" maxlength="20" aria-label="Your handle">
        <button class="go" id="follow">Follow</button>
        <p class="note" id="fnote">Practice only. Your wallet signs; it settles when RYO-CHAN launches (17 Nov).</p>
      </aside>
      <section class="card c-12" id="councilcard">
        ${(cd => cd ? `<div class="head"><h3>Before it trades, a council argues</h3><div class="r"><span class="badge ${cd.council.verdict === "skip" ? "bad" : cd.council.verdict === "half" ? "info" : "ok"}">Judge: ${esc(cd.council.verdict)} ${esc(cd.symbol)}</span></div></div>
          <div class="bento" style="gap:12px">
            <div class="inner c-6" style="padding:14px"><div class="kind enter" style="margin-bottom:8px">Bull · for</div>${(cd.council.bull || []).slice(0, 2).map(b => `<p style="margin:6px 0;${b.struck ? "text-decoration:line-through;opacity:.5" : ""}">${esc(b.text)}</p>`).join("") || '<p class="note">No argument.</p>'}</div>
            <div class="inner c-6" style="padding:14px"><div class="kind unmarked" style="margin-bottom:8px">Bear · against</div>${(cd.council.bear || []).slice(0, 2).map(b => `<p style="margin:6px 0;${b.struck ? "text-decoration:line-through;opacity:.5" : ""}">${esc(b.text)}</p>`).join("") || '<p class="note">No argument.</p>'}</div>
          </div>
          <p class="quote"><b style="color:var(--ink)">Judge:</b> ${esc(cd.council.reason)}</p>` : `<div class="head"><h3>The council</h3></div><div class="empty">The council meets whenever the rules allow a trade.</div>`)(s.decisions.find(d => d.council))}
      </section>
      ${r.closed_trades.length ? `<section class="card c-12"><div class="head"><h3>Finished trades</h3></div><div class="bento" style="gap:12px">${r.closed_trades.slice().reverse().map(c => `<div class="inner pos c-6" style="margin-top:0"><div class="l1"><span>${esc(c.symbol)} · ${esc(c.exit_reason.replace("_", " "))}</span><span class="mono ${cls(c.pnl_pct)}">${pct(c.pnl_pct)}</span></div>
          ${c.exit_reason === "stop_loss" && c.exit_price < c.stop_loss * 0.995 ? `<p class="note" style="color:var(--orange)">The price fell past the stop between hourly checks, so it sold lower than planned.</p>` : ""}
          ${c.pnl_pct > 0 ? `<div class="opts" style="margin-top:10px"><span style="background:none;padding-left:0">Good trade? Tip ${esc(s.creator.handle)}</span>${[1e6, 5e6, 1e7].map(a => `<button class="pill" data-tip="${a}" data-trade="${esc(c.symbol)} ${esc(pct(c.pnl_pct))} on ${esc(when(c.closed_at))}">${big(a)}</button>`).join("")}</div><p class="note tipnote"></p>` : ""}</div>`).join("")}</div></section>` : ""}
    </div>
    <details class="more">
      <summary>Show the full record: rules, chart, positions, stake, payments and every decision</summary>
      <div class="bento" style="margin-top:16px">
      <section class="card c-12">
        <div class="head"><h3>The rules</h3></div>
        <div class="rules" style="margin-top:0">${s.rules.market.map(t => `<span>Market: <b>${esc(t)}</b></span>`).join("")}${s.rules.entry.map(t => `<span>Buy: <b>${esc(t)}</b></span>`).join("")}
          <span>Exit: <b>${esc(s.rules.exit_text)}</b></span><span>Size: <b>${s.rules.sizing.pct_per_trade}% · max ${s.rules.sizing.max_positions}</b></span></div>
      </section>
      <section class="card c-8">
        <div class="head"><h3>Practice record</h3><div class="r"><span class="note">started ${esc(when(s.started_at))} · ${s.cycles} cycles</span></div></div>
        <div class="inner" style="padding:14px">${cd ? `<svg viewBox="0 0 760 220" width="100%" height="220" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ef08a" stop-opacity=".35"/><stop offset="1" stop-color="#3ef08a" stop-opacity="0"/></linearGradient></defs><path d="${cd} L760 220 L0 220Z" fill="url(#gf)"/><path d="${cd}" fill="none" stroke="#3ef08a" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>` : `<div class="empty">The curve starts after the next hourly cycle.</div>`}</div>
      </section>
      <section class="card c-4">
        <div class="stat inner" style="margin-top:0"><div class="k">Stake · ${big(s.stake.staked)} RYO-CHAN</div><div class="v">${big(s.stake.remaining)}</div>
          <div class="opts"><span class="badge ${s.stake.breaches ? "bad" : "ok"}">${s.stake.breaches ? `${s.stake.breaches} breaches, ${Math.round(s.stake.slashed_share * 100)}% slashed` : `${s.stake.checked} replayed · 0 breaches`}</span></div>
          <p class="note" style="margin-top:8px">Each decision that breaks its own rules costs 10% of the stake, paid to followers.</p></div>
        <div class="stat inner"><div class="k">Earned by ${esc(s.creator.handle)}</div><div class="v">${big(s.earnings.fees + s.earnings.tips)}</div><div class="opts"><span>fees ${big(s.earnings.fees)}</span><span>tips ${big(s.earnings.tips)}</span><span>burned ${big(s.earnings.burned)}</span></div></div>
      </section>
      <section class="card c-8">
        <div class="head"><h3>${esc(title)}</h3><div class="r">${d0?.replay ? `<span class="badge ${d0.replay.identical ? "ok" : "bad"}">${d0.replay.identical ? "✓ replayed: identical" : "✕ replay differs"}</span>` : ""}</div></div>
        ${d0 ? `<div class="depth">${(d0.checks || []).map(c => `<div class="drow"><div class="dbar ${c.pass ? "pass" : "fail"}"><i style="width:${barWidth(c)}%"></i><span>${esc(c.text || ruleText(c))}</span></div><span class="v">${esc(c.shown ?? val(c.actual))}</span></div>`).join("") || `<p class="note">${esc(d0.reason || "")}</p>`}</div>
          <p class="note mono">${esc(when(d0.at))} · evidence ${(d0.evidence || []).map(e => esc(e.slice(0, 8))).join(" · ")}</p>` : `<div class="empty">No decisions yet.</div>`}
      </section>
      <section class="card c-4">
        <div class="head"><h3>Open positions</h3></div>
        ${r.positions.length ? r.positions.map(p => { const span = p.take_profit - p.stop_loss, at = Math.max(0, Math.min(100, ((p.last_price ?? p.entry_price) - p.stop_loss) / span * 100)); const ch = ((p.last_price ?? p.entry_price) / p.entry_price - 1) * 100;
          return `<div class="inner pos"><div class="l1"><span>${esc(p.symbol)}</span><span class="mono ${cls(ch)}">${pct(ch)}</span></div><div class="rng"><b style="left:${at}%"></b></div><div class="ends"><span>stop ${val(p.stop_loss)}</span><span>target ${val(p.take_profit)}</span></div></div>`; }).join("") : `<div class="empty">No open positions.</div>`}
      </section>
      <section class="card c-12">
        <div class="head"><h3>Payments</h3></div>
        ${s.ledger.length ? `<div class="inner"><table class="log"><tr><th>When</th><th>Type</th><th>From</th><th>Amount</th><th>To ${esc(s.creator.handle)}</th><th>Burned</th><th>Signed</th></tr>${s.ledger.map(p => `<tr><td>${esc(when(p.at))}</td><td><span class="kind ${p.type === "tip" ? "exit" : "enter"}">${esc(p.type)}</span></td><td>${esc(p.payer)}${p.wallet ? " · " + esc(short(p.wallet)) : ""}</td><td class="mono">${big(p.amount)}</td><td class="mono">${p.split?.shisho != null ? big(p.split.shisho) : p.type === "stake" ? "locked" : "—"}</td><td class="mono">${p.split?.buyback_and_burn != null ? big(p.split.buyback_and_burn) : "—"}</td><td>${p.signed ? '<span class="badge ok">wallet</span>' : '<span class="badge info">handle</span>'}</td></tr>`).join("")}</table></div>` : `<div class="empty">No payments yet.</div>`}
      </section>
      <section class="card c-12">
        <div class="head"><h3>Every decision</h3><div class="r"><span class="note">hourly, on RYO data</span></div></div>
        <div class="inner"><table class="log"><tr><th>When</th><th>Decision</th><th>Coin</th><th>Why</th><th>Replay</th></tr>
          ${s.decisions.slice(0, 24).map(d => `<tr><td>${esc(when(d.at))}</td><td><span class="kind ${d.kind}">${esc(d.kind.replace("_", " "))}</span></td><td>${esc(d.symbol || "—")}</td><td>${esc(d.note?.text || d.reason || "")}</td><td>${d.replay?.replayable ? (d.replay.identical ? '<span class="badge ok">identical</span>' : '<span class="badge bad">differs</span>') : ""}</td></tr>`).join("")}</table></div>
      </section>
      </div>
    </details>`;
  $("#wallet").onclick = async () => { try { const w = await connectWallet(); $("#wallet").textContent = "Wallet " + short(w); } catch (e) { $("#fnote").textContent = e.message; } };
  $("#follow").onclick = async () => {
    const b = $("#follow"); b.disabled = true;
    const h = $("#handle").value.trim().toLowerCase();
    try {
      if (!/^[a-z0-9_]{3,20}$/.test(h)) throw new Error("A handle is 3-20 letters, digits or underscores.");
      const intent = await signIntent(`Shishō: I, ${h}, pay ${s.fee.fee.toLocaleString()} RYO-CHAN to follow ${s.name} for one month. Settles at RYO-CHAN launch. ${new Date().toISOString()}`);
      await payment({ type: "follow", strategy: s.id, payer: h, amount: s.fee.fee, ...intent });
      $("#fnote").textContent = `Following ${s.name}. ${intent.signature ? "Signed by " + short(intent.wallet) + ". " : ""}${HOSTED ? "Saved in this browser. " : ""}${big(s.fee.shisho)} to ${s.creator.handle}, ${big(s.fee.platform_kept)} to RYO, ${big(s.fee.buyback_and_burn)} burned, when RYO-CHAN launches.`;
      b.textContent = "Following";
    } catch (e) { $("#fnote").textContent = e.message; b.disabled = false; }
  };
  document.querySelectorAll("[data-tip]").forEach(btn => btn.onclick = async () => {
    const amount = Number(btn.dataset.tip), trade = btn.dataset.trade, out = btn.closest(".pos").querySelector(".tipnote");
    const h = ($("#handle").value || "").trim().toLowerCase();
    try {
      if (!/^[a-z0-9_]{3,20}$/.test(h)) throw new Error("Type your handle in the follow box first.");
      const intent = await signIntent(`Shishō: I, ${h}, tip ${s.creator.handle} ${amount.toLocaleString()} RYO-CHAN for ${trade}. Settles at RYO-CHAN launch. ${new Date().toISOString()}`);
      await payment({ type: "tip", strategy: s.id, payer: h, amount, trade, ...intent });
      out.textContent = `Tipped ${big(amount)} RYO-CHAN: ${big(amount * s.tip_split.shisho / s.tip_split.amount)} to ${s.creator.handle}. Thank you!`;
      btn.parentElement.querySelectorAll("button").forEach(x => x.disabled = true);
    } catch (e) { out.textContent = e.message; }
  });
}

// ── Publish ──
function shishoPublish() {
  const ex = ["Buy Solana or Avalanche when the market is fearful and they're oversold. Sell after a 10% bounce or cut at 5%. Never more than 2 at once.",
    "Ride coins with strong momentum and real trading volume when altcoins are outperforming Bitcoin. Take profit at 2 ATR, stop at 1.",
    "Only Bitcoin and Ethereum. Buy when the trend is up, RSI is between 45 and 60, and derivatives aren't crowded."];
  $("#main").innerHTML = `<div class="top"><a class="back" href="#/">← All shishō</a></div>
    <section class="banner"><h1 data-ja="<em>師匠</em>になる">Become a <em>shishō</em></h1><p>Describe your strategy in plain words. Shishō turns it into exact rules on RYO's data, you check them, and the agent starts trading them in practice at the next hourly cycle.</p><img class="mascot" src="tako-sensei.svg" width="160" height="160" alt=""></section>
    <div class="bento" style="margin-top:16px">
      <section class="card c-6">
        <div class="head"><h3>Your strategy</h3></div>
        <textarea class="field" id="ptext" rows="6" style="resize:vertical" placeholder="When…, buy…, sell…">${esc(ex[0])}</textarea>
        <div class="opts" style="margin-top:10px">${ex.map((e, i) => `<button class="pill" data-ex="${i}">Example ${i + 1}</button>`).join("")}</div>
        <input class="field" id="phandle" placeholder="Your handle, e.g. hanako_88" maxlength="20" aria-label="Your handle">
        <button class="go" id="pcompile">Turn it into rules</button>
        <p class="note" id="pnote">The rules model writes the rules; Shishō's own code checks every field before anything can run.</p>
      </section>
      <section class="card c-6" id="presult"><div class="head"><h3>Your rules</h3></div><div class="empty">They'll appear here.</div></section>
    </div>`;
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { $("#ptext").value = ex[b.dataset.ex]; });
  $("#pcompile").onclick = async () => {
    const b = $("#pcompile"); b.disabled = true; $("#pnote").textContent = "Reading your strategy…";
    try {
      const r = await api("/api/compile", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: $("#ptext").value, handle: $("#phandle").value }) });
      const s = r.strategy, x = s.exit;
      $("#presult").innerHTML = `<div class="head"><h3>${esc(s.name)}</h3><div class="r"><span class="badge ${r.errors.length ? "bad" : "ok"}">${r.errors.length ? "needs changes" : "✓ valid rules"}</span></div></div>
        <p style="color:var(--muted)">${esc(s.thesis)}</p>
        <div class="rules">
          <span>Coins: <b>${esc(s.universe.source === "list" ? s.universe.symbols.join(", ") : `RYO's top ${s.universe.top_n}${s.universe.direction ? " " + s.universe.direction : ""} movers`)}</b></span>
          ${r.readable.market.map(m => `<span>Market: <b>${esc(m)}</b></span>`).join("")}${r.readable.entry.map(m => `<span>Buy: <b>${esc(m)}</b></span>`).join("")}
          <span>Exit: <b>${x.take_profit_pct != null ? "+" + x.take_profit_pct + "%" : "+" + x.take_profit_atr + " ATR"} / ${x.stop_loss_pct != null ? "−" + x.stop_loss_pct + "%" : "−" + x.stop_loss_atr + " ATR"} / ${x.max_hold_hours}h</b></span>
          <span>Size: <b>${s.sizing.pct_per_trade}% · max ${s.sizing.max_positions}</b></span></div>
        ${r.assumptions.length ? `<p class="note" style="margin-top:12px">Assumed: ${r.assumptions.map(esc).join(" ")}</p>` : ""}
        ${r.errors.length ? `<p class="note" style="color:var(--red)">${r.errors.map(esc).join("; ")}</p>` : ""}
        ${r.right_now ? `<p class="quote">Right now, the market ${r.right_now.pass ? "matches your market rules, so it would look for coins at the next cycle" : "doesn't match your market rules" + (r.right_now.results.filter(c => !c.pass).length ? ": " + r.right_now.results.filter(c => !c.pass).map(c => `${c.text}, but it's ${c.shown}`).join("; ") : "")}.</p>` : ""}
        ${r.preview_only ? `<p class="note">This is the public preview. Publishing runs on the agent's machine, so a published strategy starts trading at its next hourly cycle.</p>` : `
        <div class="stat inner"><div class="k">Stake as your promise</div><div class="v"><span id="stakev">50M</span> <span style="font-size:13px;color:var(--muted);font-weight:500">RYO-CHAN</span></div>
          <input type="range" id="pstake" min="10" max="200" step="5" value="50" style="width:100%;accent-color:var(--green)" aria-label="Stake in millions of RYO-CHAN">
          <p class="note">Locked while you publish. Every decision is replayed from its evidence; each one that breaks your own rules costs 10% of the stake, paid to your followers.</p></div>
        <button class="pill" id="pwallet" style="width:100%;margin-top:10px">Connect Solana wallet</button>
        <button class="go" id="ppublish" ${r.errors.length ? "disabled" : ""}>Stake &amp; publish as a shishō</button>`}`;
      if ($("#pstake")) $("#pstake").oninput = e => { $("#stakev").textContent = e.target.value + "M"; };
      if ($("#pwallet")) $("#pwallet").onclick = async () => { try { const w = await connectWallet(); $("#pwallet").textContent = "Wallet " + short(w); } catch (e) { $("#pnote").textContent = e.message; } };
      $("#pnote").textContent = "Check the rules. Change your words and try again if anything's off.";
      const pb = $("#ppublish");
      if (pb) pb.onclick = async () => { pb.disabled = true; try {
        const stake = Number($("#pstake").value) * 1e6;
        const intent = await signIntent(`Shishō: I, ${s.creator.handle}, stake ${stake.toLocaleString()} RYO-CHAN behind "${s.name}". Slashed 10% for each decision that breaks its rules. Settles at RYO-CHAN launch. ${new Date().toISOString()}`);
        const p = await api("/api/publish", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ strategy: s, stake, ...intent }) }); location.hash = `#/s/${p.id}`;
      } catch (e) { $("#pnote").textContent = e.message; pb.disabled = false; } };
    } catch (e) { $("#pnote").textContent = e.message; }
    b.disabled = false;
  };
}

async function shishoHow() {
  let h = null; try { h = (await api("/api/state")).health.totals; } catch {}
  $("#main").innerHTML = `<div class="top"><a class="back" href="#/">← All shishō</a></div>
  <section class="banner"><h1 data-ja="<em>Shishō</em>の仕組み">How <em>Shishō</em> works</h1><p>Four steps, and code checks every one.</p><img class="mascot" src="tako-sensei.svg" width="170" height="170" alt=""></section>
  <div class="cards" style="margin-top:16px">
    <div class="card"><b style="font-size:16px">1 · A shishō publishes rules</b><p class="note" style="font-size:13px;color:var(--muted)">Which coins to look at, what the market must look like, what a coin must show before a practice buy, and where to take profit or stop. Every rule names a field RYO's tools actually return.</p></div>
    <div class="card"><b style="font-size:16px">2 · An agent trades them, hourly</b><p class="note" style="font-size:13px;color:var(--muted)">It reads the market once through RYO-CHAN's six research tools, checks each strategy's rules in code, and records the practice trade with every RYO answer it used, fingerprinted. An AI writes the plain note; code checks its numbers.</p></div>
    <div class="card"><b style="font-size:16px">3 · Anyone can replay it</b><p class="note" style="font-size:13px;color:var(--muted)">Each decision is rebuilt from its stored evidence and the stored version of the rules, with no network and no model. It must come out identical. A decision that doesn't costs the shishō 10% of their stake.</p></div>
    <div class="card"><b style="font-size:16px">4 · You follow a shishō</b><p class="note" style="font-size:13px;color:var(--muted)">Follow fees are paid in RYO-CHAN: 70% to the shishō, 30% to RYO, and 20% of RYO's share buys back and burns RYO-CHAN, as RYONOMICS sets out. Practice only for now; fees and stakes are simulated until staking launches.</p></div>
  </div>
  ${h ? `<section class="card" style="margin-top:16px"><div class="head"><h3>System health, logged every cycle</h3></div>
    <div class="opts">${[["cycles", h.cycles], ["RYO calls", h.calls], ["retried", h.retries], ["rate-limited", h.rate_limited], ["tool outages survived", h.tools_down], ["network waits", h.network_waits], ["notes by template", h.notes_by_template], ["council fell back to rules", h.councils_fell_back]].map(([k, v]) => `<span>${k} <b style="color:var(--ink)">${v}</b></span>`).join("")}</div>
    <p class="note">When RYO rate-limits, the agent waits and retries; when a tool is down, strategies that need it stand aside and say why; when the network is gone, the cycle waits. Nothing is filled in.</p></section>` : ""}`;
}

// Language: English by default; 日本語 swaps the page text after each render.
let LANG = (() => { try { return localStorage.getItem("shisho-lang") || "en"; } catch { return "en"; } })();
// Every swapped text remembers its English, so switching back restores the whole page,
// including parts that aren't redrawn (the sidebar).
const ORIGINAL = [];
function shishoTranslate() {
  document.documentElement.lang = LANG === "ja" ? "ja" : "en";
  if (LANG !== "ja") {
    for (const [node, text] of ORIGINAL.splice(0)) if (node.isConnected) node.nodeValue = text;
    $("#lang").textContent = "日本語";
    return;
  }
  document.querySelectorAll("[data-ja]").forEach(e => { e.innerHTML = e.dataset.ja; });
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = walk.nextNode());) { const k = n.nodeValue.trim(); if (k && k in JA) { ORIGINAL.push([n, n.nodeValue]); n.nodeValue = n.nodeValue.replace(k, JA[k]); } }
  document.querySelectorAll("[placeholder]").forEach(e => { if (JA_PH[e.placeholder]) e.placeholder = JA_PH[e.placeholder]; });
  $("#lang").textContent = "English";
}
$("#lang").onclick = () => { LANG = LANG === "ja" ? "en" : "ja"; try { localStorage.setItem("shisho-lang", LANG); } catch {} shishoRoute(); };

async function shishoRoute() {
  const h = location.hash || "#/";
  document.querySelectorAll(".side .nav").forEach(a => a.classList.toggle("on", a.getAttribute("href") === (h.startsWith("#/s/") ? "#/" : h)));
  try {
    if (h.startsWith("#/s/")) await shishoPage(decodeURIComponent(h.slice(4)));
    else if (h === "#/how") await shishoHow();
    else if (h === "#/publish") shishoPublish();
    else await shishoDiscover();
  } catch (e) { $("#main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  shishoTranslate();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", shishoRoute);
shishoRoute();
})();
</script>
